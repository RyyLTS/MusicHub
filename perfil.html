<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - perfil</title>
    <link rel = "stylesheet" href="main.css">
</head>
<body>
    <div class = "container">
        <div id="menu-lateral"></div> <!--Menu lateral-->
        <a class="carteira" href="MetodosPagamento.html"> </a>
        <main class="conteudo centralizado">
            <div class="areaCapaPerfil"> <!--Config da imagem de perfil -->
                <input 
                    type="file"
                    id="imagemCapa"
                    accept="image/*"
                    hidden
                >  
                <img id="previewCapa" alt="Prévia da capa" class="capaPerfil">

                <label for="imagemCapa" class="botaoImagemPerfil">
                    
                </label>
            </div>
            <input type="text" placeholder="Digite seu nome" class="nome">
            <h1>Biografia</h1>
            <div class="biografia">
                <textarea> </textarea>
            </div>
        <div>
            <button class="botao cancelar">Cancelar</button>
            <button class="botao salvar" type="submit">Salvar alterações</button>
        </div>
        </main>
            
    </div>
<script>
fetch("menu.html")
    .then(resposta => resposta.text())
    .then(html => {
        document.getElementById("menu-lateral").innerHTML = html;
    });
</script>
    <script><!-- Configura a alteração da imagem de perfil-->
       const inputCapa = document.getElementById("imagemCapa");
        const previewCapa = document.getElementById("previewCapa");
        const areaCapa = document.querySelector(".areaCapaPerfil");

        inputCapa.addEventListener("change", function(){

            const arquivo = this.files[0];

            if(!arquivo) return;

            previewCapa.src = URL.createObjectURL(arquivo);
            previewCapa.style.display = "block";

            areaCapa.classList.add("temImagem");
        });
    </script>
</body>
</html>
