<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - login</title>
    <link rel = "stylesheet" href="login.css">
</head>
<body>
    <div id="topo"></div>
    <div id = "container">
        <div id="principal">
            <h2>Faça login</h2>   
            <hr>
            <div class="conteudo"> 
                <form id="formLogin">
                    <label>Email:</label>
                    <input type="email" name="email" id="email" placeholder="E-mail:" required>
                    <label>Senha:</label>
                    <input type="password" name="senha" id="senha" placeholder="Senha:" required>
                </form>
                <br>
                    <a class="link" href="cadastrar.html"> Cadastre-se</a>
                    <a class="link" href="redefinirSenha.html"> Esqueci a senha</a>
            </div>
            <button class="submit" type="submit" form="formLogin">Entrar</button>
        </div>
    </div>
    <footer id="rodape"></footer>
    <script> <!--Validação de Login-->
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const dados = {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
            };

            try {
                const resposta = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(dados),
                });
                const resultado = await resposta.json();

                alert(resultado.mensagem);

                if (resposta.status === 200) {
                    window.location.href = "home.html";
                }
            } catch (error) {
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>
</body>
</html>
