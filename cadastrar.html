<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - cadastro</title>
    <link rel = "stylesheet" href="login.css">
</head>
<body>
    <div id="topo"></div>
    <div id = "container">
        <div id="principalG">
            <h2>Cadastre-se</h2>   
            <hr>
                <form id="formCadastro" class="conteudoG"> 
                    <div class="coluna">  
                        <label>
                            Nome:
                            <input type="text" name="nome" id="nome" placeholder="nome:" required>
                        </label>
                    
                        <label>
                            Email:
                            <input type="email" name="email" id="email" placeholder="E-mail:" required>
                        </label>

                        <label>
                            CPF:
                            <input type="text" name="cpf" id="cpf" placeholder="CPF:" required>
                        </label>

                        <label>
                            N° Telefone:
                            <input type="tel" name="telefone" id="telefone" placeholder="N° Telefone" required>
                        </label>
                    </div>

                    <div class="coluna">
                        <label>
                            Senha:
                            <input type="password" name="senha" id="senha" placeholder="Senha:" required>
                        </label>
                        
                        <label>
                            Confirmar senha:
                            <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirmar senha:" required>
                        </label>  
                    </div>
                </form>
                <button class="submit" type="submit" form="formCadastro">Criar conta</button>
        </div>
    </div>
    <footer id="rodape"></footer>

    <script> <!--Salvar cadastro-->
        const formulario = document.getElementById("formCadastro");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem.");
                return;
            }

            const dados = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                cpf: document.getElementById("cpf").value,
                telefone: document.getElementById("telefone").value,
                senha,
            };

            try {
                const resposta = await fetch("/cadastro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(dados),
                });
                const resultado = await resposta.json();

                alert(resultado.mensagem);

                if (resposta.status === 201) {
                    window.location.href = "login.html";
                }
            } catch (error) {
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>
</body>
</html>
